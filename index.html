const HZ=[['Gempa Bumi','🏚️','Getaran di permukaan bumi akibat pelepasan energi dari dalam bumi.','Paling sering karena pergeseran lempeng atau patahan (gempa tektonik). Bisa juga oleh aktivitas gunung api.','Lempeng saling menekan, energi menumpuk di batuan. Saat batuan tidak kuat lagi, ia patah dan energi dilepas sebagai gelombang gempa.','Bangunan rusak, tanah retak, memicu longsor, dan kadang memicu tsunami.','Indonesia dilewati tiga lempeng besar, jadi sering mengalami gempa.','Gempa Palu 2018 dan Cianjur 2022.',['Apa penyebab utama gempa tektonik?',['Hujan deras','Pergeseran lempeng','Angin kencang'],1,'Pergeseran lempeng melepaskan energi yang menumpuk di batuan.']],
['Tsunami','🌊','Rangkaian gelombang laut sangat panjang akibat gangguan besar pada massa air laut.','Gempa bawah laut tertentu (yang menggeser dasar laut ke atas atau bawah), letusan gunung api bawah laut, atau longsor bawah laut. Tidak semua gempa menyebabkan tsunami.','Dasar laut naik atau turun mendadak sehingga air di atasnya ikut terdorong dan merambat ke segala arah. Di laut dalam gelombang rendah tetapi cepat, mendekati pantai menjadi tinggi.','Air menyapu pesisir, merusak rumah, dan memakan korban jiwa.','Di laut dalam, tsunami bisa melaju sekitar 800 km/jam. Air laut yang surut mendadak adalah tanda bahaya, segera menuju tempat tinggi.','Tsunami Aceh 2004 dan Palu 2018.',['Pernyataan yang benar?',['Semua gempa pasti menyebabkan tsunami','Gempa bawah laut tertentu bisa memicu tsunami','Tsunami hanya disebabkan angin'],1,'Tsunami dipicu gangguan besar pada air laut, antara lain gempa bawah laut tertentu. Tidak semua gempa memicunya.']],
['Gunung Meletus','🌋','Keluarnya magma, gas, dan material panas dari gunung api ke permukaan (erupsi).','Magma di dapur magma naik karena tekanan gas. Indonesia punya banyak gunung api karena berada di jalur pertemuan lempeng (Cincin Api Pasifik).','Tekanan gas meningkat, magma terdorong naik lewat pipa kawah, lalu keluar sebagai ledakan atau lelehan lava.','Material: lava, awan panas, abu vulkanik, batu pijar, gas beracun. Dampak: kerusakan dan gangguan pernapasan. Abu vulkanik lama-lama membuat tanah subur.','Status gunung api dari rendah ke tinggi: Normal, Waspada, Siaga, Awas.','Erupsi Merapi 2010 dan Semeru 2021.',['Status gunung api tertinggi?',['Waspada','Siaga','Awas'],2,'Urutannya Normal, Waspada, Siaga, Awas. Awas berarti letusan sangat mungkin terjadi.']],
['Tanah Longsor','⛰️','Bergeraknya massa tanah atau batuan menuruni lereng.','Lereng curam, hujan lebat, tanah gembur, hutan gundul, dan beban bangunan di lereng.','Air hujan meresap, tanah menjadi berat dan licin pada bidang gelincir, lalu massa tanah meluncur ke bawah.','Menimbun rumah dan jalan, memutus akses, dan memakan korban.','Akar pohon yang kuat membantu mengikat tanah. Tanda awal: retakan tanah, pohon atau tiang miring, mata air keruh.','Sering terjadi di lereng perbukitan saat musim hujan.',['Tanda awal tanah longsor?',['Retakan tanah dan pohon miring','Langit cerah','Tanah rata'],0,'Retakan dan pohon miring menandakan tanah mulai bergerak.']]];

function onNav(p,s){const e=document.getElementById('rxp');if(s=='eval'){e&&e.classList.remove('show');return}
 let k=s;if(s=='dash'&&['layers','plates','haz','world','mission'].includes(p))k='back';else if(s=='home'&&p&&p!='home')k='bye';else if(s=='res')k=P.E&&P.E.s>=70?'pass':'fail';
 const x=SAY[k];x&&say(x[0],x[1])}
const RC={pickL:()=>say(['Seru! Ketuk lapisan lainnya juga ya.','Nah, itu dia lapisannya! Baca penjelasannya ya.','Keren! Bumi punya banyak lapisan lho.'],'u'),
pickP:()=>say(['Lihat arah panahnya! Lempeng itu bergerak.','Mantap! Perhatikan gerakan lempengnya ya.','Nah, begitulah lempeng bergerak!'],'u'),

pickC:()=>say(['Wah, kamu menjelajah dunia!','Pilihan bagus! Baca penjelasannya di bawah ya.','Keren, negara apa lagi yang mau kamu lihat?'],'w'),

mp:()=>S.m.ok?say(['Tepat! Kamu paham mitigasi bencana.','Yeay, pilihan yang aman!','Hebat, {n}! Jawabanmu benar.'],'h'):say(['Belum tepat. Baca alasannya lalu coba lagi ya.','Tenang, {n}, coba pilihan lain.'],'s'),

tth:()=>P.dk?say(['Malam hari! Lihat bintangnya!','Mode gelap, nyaman di mata ya.'],'u'):say(['Pagi yang cerah!','Terang benderang, semangat!'],'u'),

const prOK=()=>P.pr.n&&P.pr.k&&P.pr.u;
let pvS='';function go(s,fresh=1){if(!prOK()&&s!='home'&&s!='prof'){s='prof';S.first=1;toast('Isi profil dulu ya sebelum mulai petualangan!')}const pv=S.s;S.s=s;render(fresh);scrollTo(0,0);onNav(pv,s)}
function render(fresh){const a=$('#app');a.className=fresh?'fx':'';a.innerHTML=V[S.s]()}
function op(s){const d=D();
 if(s=='mission'&&!d.H)return toast('Pelajari dulu semua materi Bencana Kebumian ya!');
 if(s=='eval'&&!(d.L&&d.T&&d.H&&d.M))return toast('Selesaikan dulu semua materi dan Misi Mitigasi ya!');
 if(s=='haz'){S.tab=0;if(!P.H.includes(0))P.H.push(0);save()}
 if(s=='mission')S.m={i:Math.min(P.M,3),t:0,p:-1,ok:0};if(P.M>=4&&s=='mission')S.m.i=0;
 if(s=='eval')S.e={i:0,a:Array(10).fill(-1)};if(s=='world'){S.c=-1;vb=[0,0,960,500]}
 go(s)}
const add=(k,i)=>{if(!P[k].includes(i)){P[k].push(i);save()}};
const pickL=i=>{S.li=i;add('L',i);render()};
const pickP=i=>{S.pi=i;add('T',i);render()};
const tab=i=>{S.tab=i;add('H',i);render()};
const hq=j=>{S.hq[S.tab]=j;snd(j==HZ[S.tab][8][2]?'ok':'no');render()};
function mp(j){const m=S.m;if(m.ok)return;m.p=j;m.t++;snd(j==MS[m.i][3]?'ok':'no');if(j==MS[m.i][3]){m.ok=1;if(m.i>=P.M){P.M=m.i+1;P.sc+=m.t==1?25:10;save()}}render()}
function mnext(){if(S.m.i<3){S.m={i:S.m.i+1,t:0,p:-1,ok:0};render()}else{toast('Misi selesai! Evaluasi Akhir sudah terbuka.');go('dash')}}
const ans=j=>{S.e.a[S.e.i]=j;render()};
const nav=d=>{S.e.i+=d;render()};
function sub(){const a=S.e.a,u=a.filter(x=>x<0).length;
 if(u&&!confirm('Masih ada '+u+' soal belum dijawab. Kumpulkan sekarang?'))return;
 const ok=a.filter((x,i)=>x==Q[i][2]).length;
 P.at=(P.at||0)+1;P.E={s:ok*10,ok,w:[...new Set(Q.filter((q,i)=>a[i]!=q[2]).map(q=>q[4]))]};save();snd(ok>=8?'win':'no');go('res')}
function reset(){if(confirm('Hapus semua progress belajar?')){P={L:[],T:[],H:[],M:0,sc:0,E:null,pr:P.pr,sf:P.sf,bg:P.bg};save();go('dash')}}
const rem=i=>{const t=TP[i];if(t[1]=='haz'){S.tab=t[2];add('H',t[2]);go('haz')}else go(t[1])};

const start=()=>{if(prOK())go('guide');else{S.first=1;toast('Isi profilmu dulu ya sebelum mulai petualangan!');go('prof')}};
function svp(){const n=$('#pn').value.trim(),k=$('#pk').value.trim(),u=$('#pu').value.trim();if(!n||!k||!u)return toast('Nama, kelas, dan no. urut wajib diisi ya!');P.pr={n,k,u};save();toast('Profil tersimpan!');const f=S.first;S.first=0;go(f?'guide':'dash')}
const V={
world:()=>`${hdr()}<div class="card"><h2>🗺️ Peta Lempeng Dunia</h2><p class="sm">Materi tambahan: letak 195 negara pada lempeng tektonik</p><div id="wr">${rx('Pilih negara di daftar sebelah kanan. Negaranya akan naik dan berwarna di peta, lalu penjelasannya muncul di bawah!')}</div><div class="wrap"><svg id="wm" viewBox="0 0 960 500"><g id="wc">${WM}</g></svg><div><input id="ws" placeholder="🔍 Cari negara..." oninput="fc(this.value)"><div id="wl">${WLIST()}</div></div></div><p><button class="btn g" onclick="zoomTo(null)">🌍 Lihat seluruh dunia</button></p></div><div class="card" id="wp"><p class="sm">Belum ada negara yang dipilih. Pilih salah satu dari daftar atau ketuk negara di peta.</p></div><p><button class="btn g" onclick="go('dash')">◀ Kembali</button></p>`,
prof:()=>`${hdr()}<div class="card"><h2>👤 Profil Siswa</h2>${rx('Isi datamu dulu ya, supaya namamu tampil di hasil belajar!')}<label>Nama lengkap</label><input id="pn" maxlength="40" value="${esc(P.pr.n)}" placeholder="Contoh: Budi Santoso"><label>Kelas</label><input id="pk" maxlength="10" value="${esc(P.pr.k)}" placeholder="Contoh: VII A"><label>No. Urut</label><input id="pu" type="number" min="1" max="99" value="${esc(P.pr.u)}" placeholder="Contoh: 12"><p><button class="btn y" onclick="svp()">Simpan ✔</button><button class="btn g" onclick="go(prOK()?'dash':'home')">Kembali</button></p></div>`,
home:()=>`<div class="card hero"><svg class="land" viewBox="0 0 400 150"><rect width="400" height="150" rx="14" fill="#cfe9ff"/><circle cx="60" cy="35" r="18" fill="#ffd54f"/><path d="M0 150L90 50L180 150z" fill="#43a047"/><path d="M110 150L210 60L310 150z" fill="#2e7d32"/><path d="M250 150L300 55h40l50 95z" fill="#795548"/><path d="M300 55h40l-8 10h-24z" fill="#ff5722"/><circle cx="320" cy="40" r="10" fill="#9e9e9e"><animate attributeName="cy" values="45;10" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/></circle></svg><h1>🌍 GEOQUEST</h1><p><b>Jelajahi Bumi, Pahami Bencana</b></p>${rex(110,'w')}<p class="bub say">Halo! Aku Rex. Yuk jelajahi bumi bersamaku!</p><p><button class="btn y big" onclick="start()">Mulai ▶</button></p><p>${SB()}</p></div>`,
guide:()=>`${hdr()}<div class="card"><h2>Petunjuk Penggunaan</h2>${rex(70)} <span class="bub say">Baca dulu ya, biar petualanganmu lancar!</span><ol><li><b>Pilih menu:</b> ketuk kartu di Dashboard. Menu Misi dan Evaluasi terkunci sampai materi sebelumnya selesai.</li><li><b>Baca dan jelajahi materi:</b> ketuk lapisan bumi, pilih jenis lempeng, dan ganti tab bencana.</li><li><b>Simulasi:</b> pilih jenis pergerakan lempeng untuk melihat animasinya.</li><li><b>Misi Mitigasi:</b> pilih tindakan paling tepat. Kalau belum tepat, boleh coba lagi.</li><li><b>Evaluasi:</b> 10 soal, nilai minimal 70 untuk lulus. Jawaban tidak bisa diubah setelah dikumpulkan.</li></ol><button class="btn" onclick="go('dash')">Lanjutkan ▶</button></div>`,
dash:()=>{const d=D(),p=pct(),C=[['🌎','Struktur Lapisan Bumi','layers','L'],['🧭','Pergerakan Lempeng Tektonik','plates','T'],['🌋','Bencana Kebumian','haz','H'],['🎯','Misi Mitigasi Bencana','mission','M'],['📝','Evaluasi Akhir','eval','E'],['👤','Profil Siswa','prof','R'],['🗺️','Peta Lempeng Dunia','world','X']];
 const lock=k=>(k=='mission'&&!d.H)||(k=='eval'&&!(d.L&&d.T&&d.H&&d.M));
 return `<div class="top"><div class="logo">🌍 GEOQUEST</div><div>${SB()}<button class="btn g" onclick="go('home')">🏠 Beranda</button></div></div><div class="card"><div class="row"><div>${rex(70,p==100?'h':'n')} <span class="bub say">${p==100?'Hebat! Semua selesai!':p?'Ayo lanjutkan'+(P.pr.n?', '+esc(P.pr.n):'')+'!':'Halo'+(P.pr.n?', '+esc(P.pr.n):'')+'! Mulai dari Struktur Lapisan Bumi ya.'}</span></div><b>Progres ${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>${P.E?`<p class="sm">Nilai evaluasi terakhir: <b>${P.E.s}</b>/100 | Skor misi: ${P.sc}</p>`:''}${SHEET_URL?`<p class="sm">${P.q?'⏳ Menunggu koneksi untuk mengirim progres ke guru':'☁️ Progres terkirim otomatis ke guru'}</p>`:''}</div><div class="grid">${C.map(c=>`<button class="mc" onclick="op('${c[2]}')"><div class="ic">${c[0]}</div><b>${c[1]}</b><small>${c[2]=='world'?'⭐ Materi tambahan':c[2]=='prof'?(P.pr.n?'✅ Terisi':'✏️ Isi data'):d[c[3]]?'✅ Selesai':lock(c[2])?'🔒 Terkunci':'▶ Mulai'}</small></button>`).join('')}</div><p><button class="btn g" onclick="reset()">Hapus progres</button></p>`},
layers:()=>{const i=S.li,l=LY[i];return hdr()+`<div class="card"><h2>Struktur Lapisan Bumi</h2>${rx(l?'Wah, kamu menemukan '+l[0]+'! Ketuk lapisan lainnya ya ('+P.L.length+'/4).':'Ketuk tiap lapisan bumi untuk mempelajarinya ('+P.L.length+'/4).')}<div class="two"><svg class="earth" viewBox="0 0 240 240">${[[112,0],[98,1],[64,2],[32,3]].map(([r,k])=>`<circle cx="120" cy="120" r="${r}" fill="${LY[k][1]}" stroke="${i==k?'#0b3d91':'#fff'}" stroke-width="${i==k?5:2}" onclick="pickL(${k})"/>`).join('')}</svg><div>${l?`<h3>${l[0]}</h3><div class="sec"><b>Kedalaman:</b> ${l[2]}</div><p>${l[3]}</p><div class="fact">💡 <b>Fakta:</b> ${l[4]}</div>`:`<p class="sm">Ketuk lingkaran di samping untuk mulai.</p>`}<p class="sm">Gambar tidak sesuai skala.</p></div></div><button class="btn g" onclick="go('dash')">◀ Kembali</button> ${P.L.length>=4?`<button class="btn y" onclick="go('plates')">Lanjut ke Lempeng ▶</button>`:''}</div>`},
plates:()=>{const t=PT[S.pi],[x1,y1,x2,y2]=t[4];return hdr()+`<div class="card"><h2>Pergerakan Lempeng Tektonik</h2>${rx(['Lihat, kedua lempeng saling mendekat dan menekan!','Kedua lempeng menjauh, magma naik mengisi celah!','Lempeng bergeser sejajar, gesekannya bisa memicu gempa!'][S.pi]+' ('+P.T.length+'/3)')}<div class="tabs">${PT.map((p,i)=>`<button class="${i==S.pi?'on':''}" onclick="pickP(${i})">${p[0]}</button>`).join('')}</div><svg viewBox="0 0 320 150" style="width:100%;max-width:520px;display:block;margin:8px auto;background:#e3f2fd;border-radius:14px"><rect x="0" y="108" width="320" height="42" fill="#e65100" opacity=".85"/>${S.pi==1?'<rect x="135" y="40" width="50" height="110" fill="#ff5722" opacity=".9"/>':''}<g class="pl" style="--x:${x1}px;--y:${y1}px"><rect x="10" y="60" width="125" height="48" rx="6" fill="#8d6e63"/><text x="60" y="48" font-size="28">${t[5][0]}</text></g><g class="pl" style="--x:${x2}px;--y:${y2}px"><rect x="185" y="60" width="125" height="48" rx="6" fill="#a1887f"/><text x="235" y="48" font-size="28">${t[5][1]}</text></g></svg><h3>${t[0]}: ${t[1]}</h3><div class="sec"><b>Proses:</b> ${t[2]}</div><div class="sec" style="margin-top:8px"><b>Dampak:</b> ${t[3]}</div><div class="fact">💡 Lempeng bergerak sangat lambat, hanya beberapa sentimeter per tahun.</div><button class="btn g" onclick="go('layers')">◀ Kembali</button> ${P.T.length>=3?`<button class="btn y" onclick="go('haz')">Lanjut ke Bencana ▶</button>`:''}</div>`},
haz:()=>{const h=HZ[S.tab],q=h[8],c=S.hq[S.tab];return hdr()+`<div class="card"><h2>Bencana Kebumian</h2>${rx(['Gempa itu getaran dari dalam bumi. Tetap tenang ya!','Tsunami tidak selalu datang setelah gempa, tapi tetap waspada!','Abu gunung api lama-lama bisa menyuburkan tanah, lho!','Kenali tanda awal longsor agar bisa selamat!'][S.tab]+' ('+P.H.length+'/4 dibuka)')}<div class="tabs">${HZ.map((x,i)=>`<button class="${i==S.tab?'on':''}" onclick="tab(${i})">${x[1]} ${x[0]}</button>`).join('')}</div><div style="text-align:center"><span class="big-ic">${h[1]}</span></div><h3>${h[0]}</h3><div class="grid"><div class="sec"><b>Pengertian</b><br>${h[2]}</div><div class="sec"><b>Penyebab</b><br>${h[3]}</div><div class="sec"><b>Proses terjadi</b><br>${h[4]}</div><div class="sec"><b>Dampak</b><br>${h[5]}</div></div><div class="fact">💡 <b>Tahukah Kamu?</b> ${h[6]}</div><p><b>Contoh kejadian:</b> ${h[7]}</p><h3>Kuis singkat</h3><p>${q[0]}</p>${q[1].map((o,j)=>`<button class="opt ${c==j?(j==q[2]?'ok':'no'):''}" onclick="hq(${j})">${o}</button>`).join('')}${c>=0?`<div class="fb ${c==q[2]?'g':'r'}"><b>${c==q[2]?'Benar!':'Belum tepat.'}</b> ${q[3]}</div>`:''}<button class="btn g" onclick="go('plates')">◀ Kembali</button> ${P.H.length>=4?`<button class="btn y" onclick="op('mission')">Ke Misi Mitigasi ▶</button>`:''}</div>`},
mission:()=>{const m=S.m,s=MS[m.i],ok=m.ok;return hdr()+`<div class="card"><div class="row"><b>Misi ${m.i+1} dari 4</b><span>⭐ Skor: ${P.sc} | Selesai: ${P.M}/4</span></div><div class="bar"><i style="width:${(m.i+(ok?1:0))*25}%"></i></div>${rx(ok?'Mantap! Kamu paham mitigasi bencana.':m.p>=0?'Tenang, baca penjelasannya lalu coba lagi ya!':'Pikirkan tindakan paling aman dulu, baru pilih!',ok?'h':m.p>=0?'s':'n')}<div class="sit">${s[0]}</div><h3>${s[1]}</h3>${s[2].map((o,j)=>`<button class="opt ${m.p==j?(j==s[3]?'ok':'no'):''}" ${ok?'disabled':''} onclick="mp(${j})">${'ABC'[j]}. ${o[0]}</button>`).join('')}${m.p>=0?`<div class="fb ${ok?'g':'r'}"><b>${ok?'Tepat!':'Belum tepat.'}</b> ${s[2][m.p][1]}</div>`:''}${ok?`<button class="btn y" onclick="mnext()">${m.i<3?'Misi berikutnya ▶':'Selesai ✔'}</button>`:m.p>=0?`<button class="btn" onclick="S.m.p=-1;render()">Coba lagi</button>`:''}<button class="btn g" onclick="go('dash')">Dashboard</button></div>`},
eval:()=>{const i=S.e.i,a=S.e.a,q=Q[i];return hdr()+`<div class="card"><div class="row"><b>Soal ${i+1} dari 10</b><span>Terjawab ${a.filter(x=>x>=0).length}/10</span></div><div class="bar"><i style="width:${(i+1)*10}%"></i></div><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="opt ${a[i]==j?'sel':''}" onclick="ans(${j})">${'ABCD'[j]}. ${o}</button>`).join('')}<div class="row"><button class="btn g" ${i?'':'disabled'} onclick="nav(-1)">◀ Sebelumnya</button>${i<9?`<button class="btn" onclick="nav(1)">Berikutnya ▶</button>`:`<button class="btn y" onclick="sub()">Kumpulkan ✔</button>`}</div></div>`},
res:()=>{const e=P.E,a=S.e.a,pass=e.s>=70;return hdr()+`<div class="card hero"><h2>Hasil Evaluasi</h2>${rex(110,pass?'h':'s')}<p class="bub say">${pass?'Yeay, kamu lulus! Hebat banget!':'Yah, belum lulus... Tenang, kita belajar lagi ya!'}</p>${pid()}<div class="big-n">${e.s} / 100</div><p>Benar: <b>${e.ok}</b> | Salah: <b>${10-e.ok}</b> | Nilai minimal: 70</p>${pass?`<div class="badge">🏅</div><p><b>Lencana Penyelesaian diraih!</b></p><button class="btn y big" onclick="go('win')">Lanjut ▶</button>`:`<p>Jangan menyerah! Yuk pelajari lagi materi yang masih keliru.</p><button class="btn y big" onclick="go('rem')">Rekomendasi Remedial ▶</button>`}</div><div class="card"><h3>Pembahasan</h3>${Q.map((q,i)=>`<div class="fb ${a[i]==q[2]?'g':'r'}"><b>${i+1}. ${a[i]==q[2]?'✅ Benar':'❌ Salah'}</b> (jawaban benar: ${'ABCD'[q[2]]}). ${q[3]}</div>`).join('')}</div>`},
rem:()=>`${hdr()}<div class="card"><h2>Rekomendasi Remedial</h2>${rex(70,'s')} <span class="bub say">Pelajari ulang materi di bawah ini, lalu coba evaluasi lagi.</span><div class="grid" style="margin-top:12px">${P.E.w.map(i=>`<button class="mc" onclick="rem(${i})"><div class="ic">🔁</div><b>Mulai Ulang: ${TP[i][0]}</b></button>`).join('')}</div><p><button class="btn y" onclick="op('eval')">Ulangi Evaluasi</button><button class="btn g" onclick="go('dash')">Dashboard</button></p></div>`,
win:()=>`${conf()}<div class="card hero"><div class="badge">🏅</div>${rex(120,'h')}${pid()}<h2>Hebat! Kamu telah menyelesaikan petualangan GEOQUEST!</h2><p class="bub say">Rex bangga padamu!</p><div class="grid" style="margin:14px 0"><div class="sec">Progres belajar<br><b>${pct()}%</b></div><div class="sec">Nilai evaluasi<br><b>${P.E.s} / 100</b></div><div class="sec">Skor misi<br><b>${P.sc}</b></div></div><button class="btn y big" onclick="go('dash')">Kembali ke Dashboard</button></div>`};
render(1);onNav('','home');
</script></body></html>
